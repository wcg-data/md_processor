[package]
name = "md_processor"
version = "0.1.0"
edition = "2024"

[dependencies]
rdkafka = { version = "0.29", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "mysql"] }
chrono = "0.4"

[[bin]]
name = "md_processor"
path = "src/md_processor.rs"