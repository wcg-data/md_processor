[package]
name = "md_processor"
version = "0.1.0"
edition = "2021"

[dependencies]
rdkafka = { version = "0.29", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "mysql"] }
chrono = "0.4"
libc = "0.2"
num_cpus = "1.16"
memmap2 = "0.5"
byteorder = "1.4"
memoffset = "0.9.0"
ctrlc = "3.4"
clickhouse = "0.3.0"
anyhow = "1.0"
once_cell = "1.19.0"
lazy_static = "1.4"
schema_registry_converter = { version = "4.0", features = ["avro"] }
csv = "1.3"
rayon = "1.10"
polars = { version = "0.41", features = ["lazy", "parquet","serde","ndarray", "dtype-decimal"] }


[[bin]]
name = "memory_processor_on_tick"
path = "src/memory_processor_on_tick.rs"

[[bin]]
name = "test_kafka"
path = "src/test_kafka.rs"


[[bin]]
name = "parquet_processor_on_batch"
path = "src/parquet_processor_on_batch.rs"


[[bin]]
name = "parquet_processor_on_tick"
path = "src/parquet_processor_on_tick.rs"

